# Production deployment compose file -- lives on the server (not used
# locally). Unlike docker-compose.yml (local dev: builds images from
# source, bind-mounts code, runs the Vite dev server), every service here
# pulls a pre-built, already-tested image from GHCR published by
# .github/workflows/ci-cd.yml -- nothing is built on the server itself.
#
# Deploy/redeploy: `docker compose -f docker-compose.prod.yml pull && \
#   docker compose -f docker-compose.prod.yml up -d` (this is exactly
# what the GitHub Actions `deploy` job runs over SSH).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-document_clean_reconstruct}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host -- only other containers on this compose
    # network can reach it. A production DB has no business being
    # internet-reachable.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Also not published to the host, same reasoning as postgres.

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/abhiroy00/ocr-book-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-document_clean_reconstruct}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - storage_data:/app/storage
      - paddleocr_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    # No --reload (that's a dev-only convenience) and no host port
    # published -- the frontend image's nginx (see docker/frontend/
    # nginx.prod.conf) is the only thing reverse-proxying to it.

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/abhiroy00/ocr-book-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-document_clean_reconstruct}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - storage_data:/app/storage
      - paddleocr_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.core.celery_app worker -l info -Q pipeline --concurrency=${CELERY_WORKER_CONCURRENCY:-1}

  export-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/abhiroy00/ocr-book-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-document_clean_reconstruct}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - storage_data:/app/storage
      - paddleocr_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.core.celery_app worker -l info -Q export --concurrency=2 --max-tasks-per-child=100

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/abhiroy00/ocr-book-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    # Serves the built static app AND reverse-proxies /api + /ws to
    # backend:8000 (see docker/frontend/nginx.prod.conf) -- the one
    # public entry point; nothing else in this file is exposed to the host.

volumes:
  postgres_data:
  storage_data:
  paddleocr_models:
