events {}

http {
    # Real scanned legal/statute compilations in this project's corpus
    # (e.g. "The India Code" volumes) run to 700MB+ as a single PDF --
    # raised from 550m, which was silently rejecting those uploads with a
    # 413 before the request ever reached the backend's own
    # MAX_UPLOAD_SIZE_MB check (app/core/config.py, kept in sync at 1024).
    client_max_body_size 1024m;
    # Default (60s) is measured between successive chunks of the client's
    # upload, not the whole upload's duration -- but a bigger allowed file
    # means a bigger worst case if a slow connection stalls momentarily
    # mid-upload, so give it the same headroom as the proxy timeouts below.
    client_body_timeout 300s;

    # A static `upstream { server backend:8000; }` block resolves the
    # container hostname exactly once, at nginx startup, and caches that
    # IP forever -- if backend/frontend is later restarted or recreated
    # (a new deploy, a Celery/dev fix-and-restart cycle, Docker Desktop
    # recovering from a hiccup) it gets a new internal IP, and nginx keeps
    # proxying to the old dead one, failing every request with
    # "connect() failed (111: Connection refused)" / 502 until nginx
    # itself is restarted too. Confirmed as a real recurring outage on
    # this host. Fix: resolve via Docker's embedded DNS (127.0.0.11) with
    # a short TTL and a variable in proxy_pass, which forces nginx to
    # re-resolve periodically instead of caching indefinitely.
    resolver 127.0.0.11 valid=10s;

    # Load balancer: `backend` resolves to every replica started by
    # `deploy.replicas`/`--scale backend=N` in docker-compose.yml. Per
    # nginx's proxy_pass docs, a name that resolves to several addresses has
    # ALL of them used in a round-robin fashion -- so this file IS the load
    # balancer, distributing requests across all healthy replicas, while the
    # resolver above still re-resolves periodically so a recreated replica
    # gets a new IP without an nginx restart (the static-`upstream`-block
    # bug documented in the resolver comment).
    server {
        listen 80;

        location /api/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # If the replica nginx picked is down/slow, retry the request on
            # another replica instead of returning the error to the client.
            # `non_idempotent` is deliberately NOT set: retrying an upload
            # POST after it may already have been received would risk a
            # duplicate document.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            # Large document uploads (up to client_max_body_size, 550MB) can
            # take well over nginx's 60s default read/send timeout on a
            # slow connection or a loaded host — that silently kills the
            # upload with a 504 partway through. Give it real headroom.
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Same as docker/frontend/nginx.prod.conf: proxy the backend's own
        # /health instead of letting it fall through to the frontend.
        location = /health {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /ws/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # /docs (Swagger), /redoc and their /openapi.json schema are all
        # served by the backend. Grouped so the API docs are reachable on
        # the load balancer's own port (http://localhost/docs), since the
        # backend no longer publishes a host port of its own.
        location ~ ^/(docs|redoc|openapi\.json) {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            set $frontend_upstream frontend:5173;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
