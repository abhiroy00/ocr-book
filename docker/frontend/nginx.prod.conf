# Static SPA serving for the production frontend image (built by
# docker/frontend/Dockerfile.prod), PLUS reverse-proxying /api and /ws to
# the backend service -- this is the one edge nginx in production
# (docker-compose.prod.yml has no separate nginx service), unlike local
# dev where docker/nginx/nginx.conf is a distinct proxy in front of the
# Vite dev server and this file only serves static assets. Folding both
# jobs into this single nginx avoids a third proxy hop in production.
#
# No `http { }` wrapper here: this file is COPYed to
# /etc/nginx/conf.d/default.conf, which the base nginx:1.27-alpine
# image's own nginx.conf already `include`s from INSIDE its own `http {}`
# block -- nesting a second `http {}` inside that is invalid ("http
# directive is not allowed here") and was confirmed to crash-loop the
# container (2026-09-15) until this fix went in. `server {}` (with
# `resolver`/`client_max_body_size` directly inside it) is the correct
# top level for a conf.d file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 550m;

    # Docker's embedded DNS (127.0.0.11), short TTL: a static `upstream`
    # block resolves the backend hostname once at nginx startup and never
    # again -- if the backend container is later recreated (a redeploy,
    # a restart) it gets a new internal IP and nginx keeps proxying to the
    # old, dead one until nginx itself restarts too. Confirmed as a real,
    # repeated source of "works, then randomly 502s" outages on this
    # project's local dev stack (docker/nginx/nginx.conf carries the same
    # fix, with the full incident writeup in its own comment).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # React Router (client-side routing): any path that isn't a real file
    # falls back to index.html so a deep-link/refresh doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's default output naming) are safe to
    # cache aggressively; index.html itself must always be revalidated
    # so a new deploy is picked up on next load rather than served stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
