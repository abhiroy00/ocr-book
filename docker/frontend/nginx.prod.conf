# Static SPA serving for the production frontend image (built by
# docker/frontend/Dockerfile.prod). This is separate from
# docker/nginx/nginx.conf, which is the LOCAL dev-stack reverse proxy that
# forwards to the Vite dev server on :5173 -- this one serves the already-
# built static `dist/` output directly, no dev server involved.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing): any path that isn't a real file
    # falls back to index.html so a deep-link/refresh doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's default output naming) are safe to cache
    # aggressively; index.html itself must always be revalidated so a new
    # deploy is picked up on next load rather than served stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
